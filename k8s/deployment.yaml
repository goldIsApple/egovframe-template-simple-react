apiVersion: apps/v1
kind: Deployment
metadata:
  name: egov-simple-react
  labels:
    app.kubernetes.io/name: egov-simple-react
    app.kubernetes.io/part-of: egovframe-template
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: egov-simple-react
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egov-simple-react
        app.kubernetes.io/part-of: egovframe-template
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          # Replace with your registry/tag, e.g. ghcr.io/<org>/egov-simple-react:5.0.0
          image: egovframe-template-simple-react:5.0.0
          imagePullPolicy: IfNotPresent
          env:
            # 빌드팩 런타임 Node 서버가 /api/* 요청을 전달할 백엔드 주소.
            # 실제 백엔드 k8s Service 이름과 일치시킨다.
            # 다른 네임스페이스에 배포하는 경우 FQDN 으로 조정한다.
            - name: BACKEND_URL
              value: "http://seowon-app-egovframe-backend-svc-01:8080"
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
